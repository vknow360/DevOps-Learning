services:
  mysql:
    container_name: mysqldb
    image: mysql
    user: "1000:1000"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notesdb
    networks:
      - two-tier
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 60s

  go:
    build:
      context: .
    container_name: go-app
    ports:
      - "3000:8001"
    environment:
      - MYSQL_HOST=mysqldb
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=notesdb
    networks:
      - two-tier
    depends_on:
      - mysql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:8001/health || exit 1"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql-data:

networks:
  two-tier: