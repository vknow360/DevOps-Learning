services:
  mysql:
    container_name: mysqldb
    image: mysql
    user: "${UID}:${GID}"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notesdb
    networks:
      - two-tier
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 30s

  go:
    build:
      context: .
    container_name: go-app
    ports:
      - "3000:8001"
    environment:
      - MYSQL_HOST:mysqldb
      - MYSQL_USER:root
      - MYSQL_PASSWORD:root
      - MYSQL_DATABASE:notesdb
    networks:
      - two-tier
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql-data:

networks:
  two-tier: